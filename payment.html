<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment & Contact Page - SLTB Booking</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Link to external JavaScript file -->
    <script src="payment.js" defer></script>
</head>
<body>
    <!-- Header Section -->
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <div class="logo-container">
                    <img src="sltb-logo.png" alt="SLTB Logo" class="logo-img">
                    <a href="#" class="logo">SLTB Booking</a>
                </div>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#features">Features</a></li>
                    <li><a href="#routes">Routes</a></li>
                    <li><a href="#contact">Contact</a></li>
                    <li><a href="login.html" class="btn btn-primary no-hover">Login</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Payment Section -->
    <section class="payment-container">
        <h2>Payment Information</h2>
        <div class="price-display">
            <h3>Total Price: <span id="priceDisplay">0.00</span> LKR</h3>
        </div>
        <form action="payment.php" method="POST" class="payment-form" onsubmit="return validateForm()">
            <div class="form-group">
                <label for="cardNumber">Card Number</label>
                <input type="text" id="cardNumber" name="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19" required 
                oninput="formatCardNumber(this)">
            </div>
            <div class="form-group">
                <label for="cardHolder">Card Holder Name</label>
                <input type="text" id="cardHolder" name="cardHolder" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label for="expiryDate">Expiry Date</label>
                <input type="text" id="expiryDate" name="expiryDate" placeholder="MM/YY" maxlength="5" required oninput="formatExpiryDate(this)">

            </div>
            <div class="form-group">
                <label for="cvv">CVV</label>
                <input type="password" id="cvv" name="cvv" placeholder="123" maxlength="3" required>
            </div>
            <button type="submit" class="btn">Make Payment</button>
        </form>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="contact">
        <div class="container">
            <h2>Contact Us</h2>
            <form class="contact-form">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <textarea name="message" placeholder="Your Message" required></textarea>
                <button type="submit" class="btn btn-primary">Send Message</button>
            </form>
        </div>
    </section>

    <!-- Footer Section -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 SLTB Booking. All Rights Reserved.</p>
        </div>
    </footer>

    

</body>
</html>
